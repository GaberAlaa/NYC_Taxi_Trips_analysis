services:
  seaweedfs:
    image: chrislusf/seaweedfs:4.48
    command: server -dir=/data -s3 -ip=seaweedfs -ip.bind=0.0.0.0
    ports:
      - "8333:8333"
      - "9333:9333"
      - "8888:8888"
    volumes:
      - seaweedfs_data:/data
    restart: unless-stopped

  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: traffic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./config/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    ports:
      - "9092:9092"
    volumes:
      - kafka_data:/var/lib/kafka/data
    restart: unless-stopped

  spark-master:
    build: ./docker/spark
    hostname: spark-master
    environment:
      SPARK_MASTER_HOST: 0.0.0.0
      SPARK_MASTER_PORT: 7077
      SPARK_MASTER_WEBUI_PORT: 8080
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.master.Master
      - --host
      - 0.0.0.0
      - --port
      - "7077"
      - --webui-port
      - "8080"
    ports:
      - "8080:8080"
      - "7077:7077"
    volumes:
      - ./data:/opt/project/data
      - ./spark_jobs:/opt/project/spark_jobs:ro
      - ./streaming:/opt/project/streaming:ro
      - ./ml_pipeline:/opt/project/ml_pipeline:ro
    restart: unless-stopped

  spark-worker:
    build: ./docker/spark
    hostname: spark-worker
    environment:
      SPARK_WORKER_WEBUI_PORT: 8081
    command:
      - /opt/spark/bin/spark-class
      - org.apache.spark.deploy.worker.Worker
      - spark://spark-master:7077
      - --webui-port
      - "8081"
    depends_on:
      - spark-master
    ports:
      - "8082:8081"
    volumes:
      - ./spark_jobs:/opt/project/spark_jobs:ro
      - ./streaming:/opt/project/streaming:ro
      - ./ml_pipeline:/opt/project/ml_pipeline:ro
    restart: unless-stopped

  airflow:
    build: ./docker/airflow
    command: airflow standalone
    environment:
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
      AIRFLOW__CORE__EXECUTOR: SequentialExecutor
      AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: sqlite:////opt/airflow/airflow.db
    ports:
      - "8081:8080"
    volumes:
      - ./airflow/dags:/opt/airflow/dags
      - airflow_data:/opt/airflow
      - ./spark_jobs:/opt/project/spark_jobs:ro
      - ./ml_pipeline:/opt/project/ml_pipeline:ro
    depends_on:
      - spark-master
      - postgres
      - seaweedfs
      - kafka
    restart: unless-stopped

  superset:
    build: ./docker/superset
    environment:
      SUPERSET_CONFIG_PATH: /app/pythonpath/superset_config.py
    ports:
      - "8088:8088"
    volumes:
      - superset_home:/app/superset_home
      - ./config/superset/superset_config.py:/app/pythonpath/superset_config.py:ro
    depends_on:
      - postgres
    restart: unless-stopped

  streamlit:
    build: ./streamlit_app
    ports:
      - "8501:8501"
    volumes:
      - ./data:/data:ro
      - ./streamlit_app:/app
    depends_on:
      - seaweedfs
      - postgres
    restart: unless-stopped

volumes:
  seaweedfs_data:
  postgres_data:
  kafka_data:
  airflow_data:
  superset_home:
